ReleaseNotes: |-
  More devices, two new languages, and fixes.
  New devices: Logitech PRO X3 SUPERSTRIKE and other mice on the newest Lightspeed receiver; Razer BlackShark V3 and V3 Pro; HyperX Cloud Flight S; Sony INZONE Buds; MCHOSE G3 A; Keychron and SKN mice on the Ultra-Link 8K receiver; ATK 8K Nano and 1K/8K dongles.
  New: Russian and Brazilian Portuguese; a Cancel button while a device scan runs; a switched-off device in the tray popup keeps its last reading with how long ago it was read.
  Fixed: mice on Compx receivers such as the Redragon M901P-KS and AJAZZ AJ199; Attack Shark X11 and other Beken receivers; classic Bluetooth headsets now appear in Add device; closing the app from outside is no longer counted as an error.
